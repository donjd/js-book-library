<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script defer src="main.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Donjd's Libary</h1>
    <main id="library"></main>
    <section class="form-container">
      <div>
        <button class="add-book-btn">Add book</button>
        <select name="" id="">
          <option value="placeholder" default disabled>Sort By</option>
          <option value="ascending" default>Ascending</option>
          <option value="decending" default>Decending</option>
        </select>
        <button id="sort-AZ" class="sort-btn">Sort A-Z</button>
        <button id="sort-ZA" class="sort-btn">Sort Z-A</button>
      </div>
      <form>
        <label for="new-book-title">Title:</label>
        <input type="text" name="book-title" class="book-title" id="title" />
        <label for="new-book-author">Author: </label>
        <input type="text" name="book-author" class="book-author" id="author" />
        <label for="isbn">ISBN:</label>
        <input type="text" name="isbn" class="isbn" id="isbn" />
        <fieldset class="have-read">
          <legend>Have you read this?</legend>
          <input type="radio" name="have-read" value="yes" id="have-read" />
          <label for="have-read">Yes</label>
          <input type="radio" name="have-read" value="no" id="have-not-read" />
          <label for="have-not-read">No</label>
        </fieldset>
        <button class="add-book-to-library-btn">Add book to library</button>
      </form>
    </section>
  </body>
</html>
